<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Garden Besties</title>
    
    <style>
        body {
            background-color: #FFF5EC;
            color: #5D4037;
            font-family: sans-serif;
            padding: 20px;
            margin: 0;
        }

        header {
            text-align: center;
            padding-bottom: 20px;
        }

        .search-bar {
            width: 100%;
            padding: 15px;
            border: 2px solid #A0E8AF;
            border-radius: 20px;
            font-size: 1rem;
            margin-bottom: 20px;
            outline: none;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .plant-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #FF9A8B;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌸 Garden Besties 🌿</h1>
    </header>

    <input type="text" id="searchInput" class="search-bar" placeholder="🔍 Search plants..." onkeyup="handleSearch()">
    
    <div id="searchResults"></div>

    <script>
        const plantDB = [
            { id: 'tomato', name: 'Tomato', emoji: '🍅', water: 'Every 2 days' },
            { id: 'pepper', name: 'Pepper', emoji: '🌶️', water: 'Every 3 days' },
            { id: 'cucumber', name: 'Cucumber', emoji: '🥒', water: 'Every 2 days' },
            { id: 'mint', name: 'Mint', emoji: '🌿', water: 'Every 2 days' },
            { id: 'basil', name: 'Basil', emoji: '🌱', water: 'Every 3 days' }
        ];

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const resultsContainer = document.getElementById('searchResults');
            
            if (query === "") {
                resultsContainer.innerHTML = "";
                return;
            }

            const matches = plantDB.filter(plant => 
                plant.name.toLowerCase().includes(query)
            );
            
            if (matches.length === 0) {
                resultsContainer.innerHTML = "<p>No plants found.</p>";
                return;
            }

            resultsContainer.innerHTML = matches.map(plant => `
                <div class="card">
                    <div class="plant-name">${plant.emoji} ${plant.name}</div>
                    <p>💧 Water: ${plant.water}</p>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
