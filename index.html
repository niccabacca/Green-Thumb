<style>
    :root {
        --bg-color: #FFF5EC;
        --card-bg: #FFFFFF;
        --primary: #FF9A8B;
        --secondary: #A0E8AF;
        --text-main: #5D4037;
        --text-light: #8D6E63;
        --accent: #FFD54F;
        --danger: #FF8A65;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', sans-serif;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-main);
        padding-top: env(safe-area-inset-top);
        padding-bottom: calc(env(safe-area-inset-bottom) + 80px);
        overflow-x: hidden;
    }

    header {
        background-color: var(--secondary);
        color: var(--text-main);
        padding: 20px 16px 15px;
        text-align: center;
        font-size: 1.5rem;
        font-weight: bold;
        position: sticky;
        top: 0;
        z-index: 100;
        box-shadow: 0 4px 15px rgba(160, 232, 175, 0.4);
        border-bottom-left-radius: 20px;
        border-bottom-right-radius: 20px;
    }

    .tab-content { display: none; padding: 20px 16px; animation: fadeIn 0.3s ease-in-out; }
    .tab-content.active { display: block; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .card {
        background: var(--card-bg);
        border-radius: 24px;
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 8px 20px rgba(93, 64, 55, 0.08);
        border: 2px solid transparent;
    }
    
    .search-bar, .input-area {
        width: 100%;
        padding: 15px 20px;
        border: 2px solid var(--secondary);
        border-radius: 20px;
        font-size: 1.1rem;
        color: var(--text-main);
        background: #fff;
        outline: none;
        margin-bottom: 15px;
        transition: border-color 0.2s;
    }
    .search-bar:focus, .input-area:focus { border-color: var(--primary); }

    button.btn {
        background: var(--primary);
        color: white;
        border: none;
        padding: 15px;
        border-radius: 20px;
        font-size: 1.1rem;
        font-weight: bold;
        width: 100%;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(255, 154, 139, 0.4);
        transition: transform 0.1s;
    }
    button.btn:active { transform: scale(0.96); }

    .plant-header {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 15px;
    }
    .plant-emoji { font-size: 2.5rem; background: var(--bg-color); padding: 10px; border-radius: 20px; }
    .plant-title { font-size: 1.4rem; font-weight: bold; color: var(--primary); }
    .plant-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 5px; }
    .tag { background: var(--secondary); color: var(--text-main); font-size: 0.8rem; padding: 4px 10px; border-radius: 12px; }
    .variety-tag { background: #FFE4E1; color: #D84315; border: 1px dashed #FFAB91; font-size: 0.75rem; }

    .instruction-row { margin-bottom: 12px; font-size: 0.95rem; line-height: 1.4; }
    .instruction-row strong { color: var(--primary); }
    
    .calculator-box {
        background: var(--bg-color);
        padding: 15px;
        border-radius: 16px;
        margin-top: 15px;
    }
    .date-input {
        width: 100%; padding: 10px; border-radius: 12px; border: 2px solid var(--primary); margin: 10px 0; font-size: 1rem;
    }
    .timeline { margin-top: 10px; font-size: 0.9rem; }
    .timeline-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dashed #ccc; }

    .match-card { border-color: var(--secondary); }
    .warning-card { border-color: var(--danger); background: #FFF3E0; }
    .combo-emoji { font-size: 1.8rem; letter-spacing: 5px; }

    nav {
        position: fixed; bottom: 0; left: 0; width: 100%;
        background: var(--card-bg);
        display: flex; justify-content: space-around;
        padding: 10px 0 calc(env(safe-area-inset-bottom) + 10px);
        box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
        border-top-left-radius: 24px; border-top-right-radius: 24px;
        z-index: 100;
    }
    .nav-btn {
        background: none; border: none; color: var(--text-light);
        display: flex; flex-direction: column; align-items: center;
        font-size: 0.8rem; font-weight: bold; width: 50%; padding: 10px;
    }
    .nav-btn.active { color: var(--primary); }
    .nav-icon { font-size: 1.8rem; margin-bottom: 4px; transition: transform 0.2s; }
    .nav-btn.active .nav-icon { transform: scale(1.2); }
    
    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-light); }
    .empty-state-emoji { font-size: 4rem; margin-bottom: 10px; }
</style>
<header>🌸 Garden Besties 🌿</header>

<main id="tab-search" class="tab-content active">
    <input type="text" id="searchInput" class="search-bar" placeholder="🔍 Search veggies, herbs, flowers..." onkeyup="handleSearch()">
    <div id="searchResults">
        <div class="empty-state">
            <div class="empty-state-emoji">🌱</div>
            <p>Type a plant to get care info and calculate dates!</p>
        </div>
    </div>
</main>

<main id="tab-companions" class="tab-content">
    <div class="card">
        <h2 style="color:var(--primary); margin-bottom: 10px;">🤝 Matchmaker</h2>
        <p style="font-size: 0.9rem; margin-bottom: 15px;">What seeds do you have? Enter them separated by commas!</p>
        <textarea id="seedsInput" class="input-area" rows="3" placeholder="e.g. spinach, mint, lettuce, tomato"></textarea>
        <button class="btn" onclick="analyzeCompanions()">✨ Analyze Seeds ✨</button>
    </div>
    <div id="companionResults"></div>
</main>

<nav>
    <button class="nav-btn active" onclick="switchTab('search', this)">
        <span class="nav-icon">📖</span>
        <span>Encyclopedia</span>
    </button>
    <button class="nav-btn" onclick="switchTab('companions', this)">
        <span class="nav-icon">🤝</span>
        <span>Companions</span>
    </button>
</nav>

    function switchTab(tab, btn) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tab-${tab}).classList.add('active');
        btn.classList.add('active');
    }

    function handleSearch() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const resultsContainer = document.getElementById('searchResults');
        
        if (query === "") {
            resultsContainer.innerHTML = 
                <div class="empty-state">
                    <div class="empty-state-emoji">🌱</div>
                    <p>Type a plant to get care info and calculate dates!</p>
                </div>;
            return;
        }

        const matches = plantDB.filter(p => 
            p.name.toLowerCase().includes(query) || 
            p.id.includes(query) ||
            (p.varieties && p.varieties.some(v => v.toLowerCase().includes(query) || query.includes(v.toLowerCase())))
        );
        
        if (matches.length === 0) {
            resultsContainer.innerHTML = <div class="empty-state"><div class="empty-state-emoji">🧐</div><p>No plants found for "${query}". Try tomato, mint, or lettuce!</p></div>;
            return;
        }

        resultsContainer.innerHTML = matches.map(plant => generatePlantCard(plant)).join('');
    }

    function generatePlantCard(plant) {
        const varietiesHtml = plant.varieties ? plant.varieties.map(v => <span class="tag variety-tag">${v}</span>).join('') : '';
        return 
            <div class="card">
                <div class="plant-header">
                    <div class="plant-emoji">${plant.emoji}</div>
                    <div>
                        <div class="plant-title">${plant.name}</div>
                        <div class="plant-tags">
                            <span class="tag">💧 Water: Every ${plant.waterFreq} days</span>
                            <span class="tag">⏱ Harvest: ${plant.harvestDays} days</span>
                        </div>
                    </div>
                </div>
                
                ${varietiesHtml ? <div style="margin-bottom: 12px; font-size: 0.85rem; color: var(--text-light);"><strong>Includes variations:</strong><div class="plant-tags">${varietiesHtml}</div></div> : ''}

                <div class="instructions">
                    <div class="instruction-row">🌱 <strong>Sow:</strong> ${plant.instructions.sow}</div>
                    <div class="instruction-row">💧 <strong>Water (Every ${plant.waterFreq} days):</strong> ${plant.instructions.water}</div>
                    <div class="instruction-row">✨ <strong>Fertilize:</strong> ${plant.instructions.fertilize}</div>
                    <div class="instruction-row">🧺 <strong>Yield:</strong> ${plant.instructions.yield}</div>
                </div>

                <div class="calculator-box">
                    <strong style="color:var(--text-main);">📅 Set Sowing Date:</strong>
                    <input type="date" class="date-input" onchange="calculateDates(this.value, '${plant.id}')">
                    <div id="timeline-${plant.id}" class="timeline">
                    </div>
                </div>
                <button class="btn" onclick="sharePlant('${plant.id}')" style="margin-top:15px; background:var(--secondary); color:var(--text-main);">📤 Share Plant Guide</button>
            </div>
        ;
    }

    function calculateDates(dateStr, plantId) {
        const plant = plantDB.find(p => p.id === plantId);
        if (!plant || !dateStr) return;

        const baseDate = new Date(dateStr);
        const addDays = (days) => {
            const d = new Date(baseDate);
            d.setDate(d.getDate() + days);
            return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
        };

        const germDate = addDays(plant.germinationDays);
        const fertDate = addDays(plant.fertilizeDays);
        const harvDate = addDays(plant.harvestDays);
        const sownDate = baseDate.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

        const timelineHtml = 
            <div class="timeline-item"><span>🌱 Sown on:</span> <strong>${sownDate}</strong></div>
            <div class="timeline-item"><span>🌿 Expected Germination:</span> <strong>${germDate}</strong></div>
            <div class="timeline-item"><span>✨ First Fertilize:</span> <strong>${fertDate}</strong></div>
            <div class="timeline-item" style="color:var(--primary);"><span>🧺 Estimated Harvest:</span> <strong>${harvDate}</strong></div>
            <button class="btn" onclick="shareTimeline('${plant.id}', '${sownDate}', '${germDate}', '${fertDate}', '${harvDate}')" style="margin-top:15px; background:var(--accent); color:var(--text-main); font-size: 0.95rem; padding: 12px;">📅 Share Calendar</button>
        ;

        document.getElementById(timeline-${plantId}).innerHTML = timelineHtml;
    }

    function analyzeCompanions() {
        const input = document.getElementById('seedsInput').value.toLowerCase();
        const resultsContainer = document.getElementById('companionResults');
        
        if (!input) {
            resultsContainer.innerHTML = <p style="text-align:center; color:var(--text-light);">Please enter some seeds first! 🥺</p>;
            return;
        }

        let processedInput = input.replace(/ and /g, ',');
        const seedNames = processedInput.split(/[,]+/).map(s => s.trim()).filter(s => s !== '');
        
        const matchedPlants = [];
        const unknownSeeds = [];

        seedNames.forEach(seed => {
            const found = plantDB.find(p => 
                p.name.toLowerCase().includes(seed) || 
                seed.includes(p.name.toLowerCase()) ||
                (p.varieties && p.varieties.some(v => v.toLowerCase().includes(seed) || seed.includes(v.toLowerCase())))
            );
            
            if (found && !matchedPlants.some(m => m.id === found.id)) {
                matchedPlants.push(found);
            } else if (!found) {
                unknownSeeds.push(seed);
            }
        });

        if (matchedPlants.length === 0) {
            resultsContainer.innerHTML = <div class="empty-state"><div class="empty-state-emoji">🤷‍♀️</div><p>I don't recognize any of those plants yet! Try tomato, spinach, mint, or basil.</p></div>;
            return;
        }

        let html = ;
        let shareText = 🤝 Garden Besties Matchmaker Results:\n\n;
        
        html += <button class="btn" onclick="shareCompanions()" style="margin-bottom: 15px; background: var(--secondary); color: var(--text-main);">📤 Share Match Results</button>;

        let goodCombos = [];
        let badCombos = [];

        for (let i = 0; i < matchedPlants.length; i++) {
            for (let j = i + 1; j < matchedPlants.length; j++) {
                const p1 = matchedPlants[i];
                const p2 = matchedPlants[j];

                if (p1.companions.includes(p2.id) || p2.companions.includes(p1.id)) {
                    goodCombos.push({p1, p2});
                }
                if (p1.enemies.includes(p2.id) || p2.enemies.includes(p1.id)) {
                    badCombos.push({p1, p2});
                }
            }
        }

        if (badCombos.length > 0) {
            html += <div class="card warning-card">
                <h3 style="color:var(--danger);">🚨 Do NOT Plant Together!</h3>
                ${badCombos.map(combo => <p style="margin-top:10px;">${combo.p1.emoji} <strong>${combo.p1.name}</strong> + ${combo.p2.emoji} <strong>${combo.p2.name}</strong></p>).join('')}
                <p style="font-size:0.8rem; margin-top:5px; color:#d84315;">They stunt each other's growth or attract shared pests. Keep them in separate beds!</p>
            </div>;
            shareText += 🚨 Do NOT Plant Together:\n${badCombos.map(combo => ${combo.p1.name} + ${combo.p2.name}).join('\n')}\n\n;
        }

        if (goodCombos.length > 0) {
            html += <div class="card match-card">
                <h3 style="color:var(--secondary);">💕 Garden Besties!</h3>
                ${goodCombos.map(combo => <p style="margin-top:10px;" class="combo-emoji">${combo.p1.emoji} 🤝 ${combo.p2.emoji}</p><p><strong>${combo.p1.name}</strong> and <strong>${combo.p2.name}</strong> love being planted together!</p>).join('')}
            </div>;
            shareText += 💕 Garden Besties:\n${goodCombos.map(combo => ${combo.p1.name} + ${combo.p2.name}).join('\n')}\n\n;
        }

        if (goodCombos.length === 0 && badCombos.length === 0 && matchedPlants.length > 1) {
            html += <div class="card">
                <h3>🤷‍♀️ Neutral Ground</h3>
                <p>These plants don't explicitly help or harm each other. They are fine to be neighbors!</p>
            </div>;
        }
        
        html += <h3 style="margin: 20px 0 10px; color:var(--primary); text-align:center;">🔍 Best Friends for your Seeds</h3>;
        html += <div class="card" style="padding: 15px;">;
        shareText += 🔍 Individual Seed Preferences:\n;
        
        matchedPlants.forEach(plant => {
            const comps = plant.companions.map(c => c.charAt(0).toUpperCase() + c.slice(1)).join(', ');
            const enemies = plant.enemies.map(c => c.charAt(0).toUpperCase() + c.slice(1)).join(', ');
            
            html += <div style="margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px dashed #eee;">
                <div style="font-weight:bold; font-size:1.1rem;">${plant.emoji} ${plant.name}</div>
                <div style="font-size: 0.9rem; color: var(--secondary); font-weight: bold;">💕 Loves: <span style="color:var(--text-main); font-weight:normal;">${comps || 'None listed'}</span></div>
                ${enemies ? <div style="font-size: 0.9rem; color: var(--danger); font-weight: bold;">🚫 Hates: <span style="color:var(--text-main); font-weight:normal;">${enemies}</span></div> : ''}
            </div>;
            
            shareText += - ${plant.name} loves: ${comps || 'None listed'}\n;
            if(enemies) shareText +=   (Hates: ${enemies})\n;
        });
        html += </div>;

        html += <h3 style="margin: 20px 0 10px; color:var(--primary); text-align:center;">📋 Mini Care Guides</h3>;
        matchedPlants.forEach(plant => {
            html += 
                <div class="card" style="padding: 15px;">
                    <div style="font-weight:bold; font-size:1.2rem; margin-bottom:10px;">${plant.emoji} ${plant.name}</div>
                    <div class="instruction-row">🌱 <strong>Sow:</strong> ${plant.instructions.sow}</div>
                    <div class="instruction-row">💧 <strong>Water (Every ${plant.waterFreq} days):</strong> ${plant.instructions.water}</div>
                    <div class="instruction-row">✨ <strong>Fertilize:</strong> ${plant.instructions.fertilize}</div>
                    <div class="instruction-row">🧺 <strong>Yield:</strong> ${plant.instructions.yield}</div>
                </div>
            ;
        });

        if (unknownSeeds.length > 0) {
            html += <p style="text-align:center; font-size:0.8rem; color:var(--text-light);">Note: I don't have data for ${unknownSeeds.join(', ')} yet!</p>;
        }

        resultsContainer.innerHTML = html;
        
        window.lastCompanionShareText = shareText + "\nVia Garden Besties App 🌿";
    }
    
    function sharePlant(plantId) {
        const plant = plantDB.find(p => p.id === plantId);
        if (!plant) return;
        
        const text = 🌸 ${plant.name} Care Guide:\n\n🌱 Sow: ${plant.instructions.sow}\n💧 Water (Every ${plant.waterFreq} days): ${plant.instructions.water}\n✨ Fertilize: ${plant.instructions.fertilize}\n🧺 Yield: ${plant.instructions.yield}\n\nVia Garden Besties App 🌿;
        
        if (navigator.share) {
            navigator.share({
                title: ${plant.name} Care Guide,
                text: text
            }).catch(err => console.log('Error sharing:', err));
        } else {
            alert("Sharing is not supported on this device/browser. Here is the data to copy:\n\n" + text);
        }
    }
    
    function shareTimeline(plantId, sown, germ, fert, harv) {
        const plant = plantDB.find(p => p.id === plantId);
        if (!plant) return;

        const text = 📅 ${plant.name} Planting Calendar:\n\n🌱 Sown: ${sown}\n🌿 Germination: ${germ}\n✨ Fertilize: ${fert}\n💧 Water: Every ${plant.waterFreq} days\n🧺 Estimated Harvest: ${harv}\n\nVia Garden Besties App 🌿;

        if (navigator.share) {
            navigator.share({
                title: ${plant.name} Planting Calendar,
                text: text
            }).catch(err => console.log('Error sharing:', err));
        } else {
            alert("Sharing is not supported on this device/browser. Here is the data to copy:\n\n" + text);
        }
    }

    function shareCompanions() {
        if (!window.lastCompanionShareText) return;
        
        if (navigator.share) {
            navigator.share({
                title: Garden Matchmaker Results,
                text: window.lastCompanionShareText
            }).catch(err => console.log('Error sharing:', err));
        } else {
            alert("Sharing is not supported on this device/browser. Here is the data to copy:\n\n" + window.lastCompanionShareText);
        }
    }
</script>
